<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TNC Contactos</title>

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>

        *,
        *::before,
        *::after{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{

            font-family:'Inter', sans-serif;

            background:#777fa3;

            background:linear-gradient(
                185deg,
                rgba(119, 127, 163, 1) 0%,
                rgba(73, 80, 107, 1) 34%,
                rgba(46, 52, 68, 1) 63%,
                rgba(26, 30, 38, 1) 97%
            );

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:20px;

            color:white;

            overflow-x:hidden;
        }

        .container{

            width:100%;
            max-width:420px;

            display:flex;
            flex-direction:column;
            align-items:center;

            gap:24px;

            padding:0 16px;
        }

        .logo{

            width:100%;
            max-width:240px;

            height:auto;

            animation:logoEntrance .8s ease-out forwards;
        }

        @keyframes logoEntrance{

            0%{
                opacity:0;
                transform:scale(.8) translateY(-20px);
            }

            100%{
                opacity:1;
                transform:scale(1) translateY(0);
            }
        }

        .description{

            text-align:center;

            line-height:1.6;

            font-size:.95rem;

            color:rgba(255,255,255,.92);

            animation:fadeIn .8s ease-out .2s forwards;

            opacity:0;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(10px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .buttons{

            width:100%;

            display:flex;
            flex-direction:column;

            gap:14px;

            animation:fadeIn .8s ease-out .4s forwards;

            opacity:0;
        }

        .btn{

            display:flex;

            align-items:center;
            justify-content:center;

            min-height:50px;

            padding:15px 22px;

            background:#d67c1e;

            color:#ffffff;

            text-decoration:none;

            border-radius:14px;

            font-size:1rem;
            font-weight:600;

            transition:
                transform .2s ease,
                box-shadow .2s ease;

            text-align:center;
        }

        .btn:hover{

            transform:scale(1.03);

            box-shadow:
                0 8px 25px rgba(255,170,85,.45);
        }

        .btn:active{

            transform:scale(.98);
        }

        .btn:focus{

            outline:2px solid white;

            outline-offset:2px;
        }

    </style>

</head>

<body>

    <main class="container">

        <!-- Cambia esta ruta por tu logo -->
        <img
            src="logo/logo-tnc.png"
            alt="Logo TNC"
            class="logo">

        <p class="description">
            Contacta rápidamente al área que necesites.
        </p>

        <nav class="buttons">

            <a
                href="http://wa.me/55108936"
                target="_blank"
                class="btn">

                Tráfico

            </a>

            <a
                href="http://wa.me/5513069548"
                target="_blank"
                class="btn">

                Mantenimiento

            </a>

            <a
                href="http://wa.me/5549978783"
                target="_blank"
                class="btn">

                Liquidación

            </a>

            <a
                href="http://wa.me/5554164039"
                target="_blank"
                class="btn">

                Recursos Humanos

            </a>

            <a
                href="http://wa.me/5579386209"
                target="_blank"
                class="btn">

                Monitoreo Nocturno

            </a>

        </nav>

    </main>

</body>

</html>
