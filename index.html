<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TNC Contactos</title>

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            font-family: 'Inter', sans-serif;

            background: #777fa3;

            background: linear-gradient(
                185deg,
                rgba(119, 127, 163, 1) 0%,
                rgba(73, 80, 107, 1) 34%,
                rgba(46, 52, 68, 1) 63%,
                rgba(26, 30, 38, 1) 97%
            );

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            color: white;

            overflow-x: hidden;
        }

        .container {

            width: 100%;
            max-width: 420px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 24px;

            padding: 0 16px;
        }

        .logo {

            width: 100%;
            max-width: 240px;

            height: auto;

            opacity: 0;

            animation: slideInLeft .4s ease-out forwards;
        }

        .description {

            text-align: center;

            line-height: 1.6;

            font-size: .95rem;

            color: rgba(255, 255, 255, .92);

            opacity: 0;

            animation: fadeIn .8s ease-out .2s forwards;
        }

        .buttons {

            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 14px;
        }

        .btn {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            min-height: 54px;

            padding: 15px 24px;

            background: #d67c1e;

            color: #ffffff;

            text-decoration: none;

            border-radius: 14px;

            font-size: 1rem;
            font-weight: 600;

            opacity: 0;

            animation: fadeInUp .8s ease-out forwards;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .btn i {

            font-size: 1.2rem;

            color: white;
        }

        .btn:nth-child(1) {
            animation-delay: .4s;
        }

        .btn:nth-child(2) {
            animation-delay: .6s;
        }

        .btn:nth-child(3) {
            animation-delay: .8s;
        }

        .btn:nth-child(4) {
            animation-delay: 1s;
        }

        .btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 0 12px rgba(255, 170, 85, .5),
                0 0 25px rgba(255, 170, 85, .4),
                0 0 40px rgba(255, 170, 85, .3);
        }

        .btn:active {

            transform: scale(.98);
        }

        .btn:focus {

            outline: 2px solid white;

            outline-offset: 2px;
        }

        .footer {

            margin-top: 24px;

            text-align: center;

            font-size: .85rem;

            font-weight: 500;

            color: rgba(255, 255, 255, .7);

            animation: fadeIn .8s ease-out 1.2s forwards;

            opacity: 0;
        }

        @keyframes slideInLeft {

            from {
                opacity: 0;
                transform: translateX(-120px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {

            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>

</head>

<body>

    <main class="container">

        <img
            src="Logo/logotnc.png"
            alt="Logo TNC"
            class="logo">

        <p class="description">
            Selecciona el departamento para abrir WhatsApp y recibir la atención correspondiente.
        </p>

        <nav class="buttons">

            <a
                href="https://wa.me/5510893686?text=Hola%2C%20soy%20operador%20de%20TNC.%20Necesito%20apoyo%20con%20el%20área%20de%20Tráfico."
                target="_blank"
                rel="noopener noreferrer"
                class="btn">

                <i class="fa-brands fa-whatsapp"></i>
                Tráfico

            </a>

            <a
                href="https://wa.me/5579386209?text=Hola%2C%20soy%20operador%20de%20TNC.%20Necesito%20apoyo%20con%20el%20área%20de%20Monitoreo."
                target="_blank"
                rel="noopener noreferrer"
                class="btn">

                <i class="fa-brands fa-whatsapp"></i>
                Monitoreo

            </a>

            <a
                href="https://wa.me/5513069548?text=Hola%2C%20soy%20operador%20de%20TNC.%20Necesito%20apoyo%20con%20el%20área%20de%20Mantenimiento."
                target="_blank"
                rel="noopener noreferrer"
                class="btn">

                <i class="fa-brands fa-whatsapp"></i>
                Mantenimiento

            </a>

            <a
                href="https://wa.me/5535008065?text=Hola%2C%20soy%20operador%20de%20TNC.%20Necesito%20apoyo%20con%20el%20área%20de%20Liquidaciones."
                target="_blank"
                rel="noopener noreferrer"
                class="btn">

                <i class="fa-brands fa-whatsapp"></i>
                Liquidaciones

            </a>

        </nav>

        <footer class="footer">
            Autotransporte Nacional de Carga TNC S.A. de C.V.
        </footer>

    </main>

</body>

</html>
